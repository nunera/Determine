; Determine cue board — Seeed XIAO ESP32-C3 (Arch §5).
; Build:  pio run -e xiao_esp32c3        Flash: pio run -e xiao_esp32c3 -t upload
; Tests:  pio test -e native             (host, pure logic in lib/cue_logic)

[platformio]
default_envs = xiao_esp32c3

[common]
build_flags =
  -I../common/include
  -Wall

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; ToF mounting transform (verify on the bench, README "Orientation check").
  -DDT_TOF_FLIP_X=0
  -DDT_TOF_FLIP_Y=0
  -DDT_TOF_ROTATE=0
  ; I2C clock; 1000000 only if the bench shows no read errors.
  -DDT_I2C_HZ=400000
  ; Uncomment to drive the ERM motors with MOSFETs on GPIO21/GPIO20 instead of DRV2605L.
  ; -DDT_HAPTIC_MOSFET
lib_deps =
  sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3
  adafruit/Adafruit DRV2605 Library@^1.2.4

[env:native]
platform = native
test_framework = unity
build_flags =
  ${common.build_flags}
  -lm
lib_compat_mode = off
