; Determine cue board — Seeed XIAO ESP32-C3 (Arch §5).
; Build:  pio run -e xiao_esp32c3        Flash: pio run -e xiao_esp32c3 -t upload
; Tests:  pio test -e native             (host, pure logic in lib/cue_logic)

[platformio]
default_envs = xiao_esp32c3

[common]
build_flags =
  -I../common/include
  -Wall

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; I2C clock; 1000000 only if the bench shows no read errors.
  -DDT_I2C_HZ=400000
  ; Uncomment to drive two motors with MOSFETs on GPIO21/GPIO20 instead of the Modulino Vibro.
  ; -DDT_HAPTIC_MOSFET
lib_deps =
  ; The purchased Modulino Distance reports VL53L4ED ID 0xECAA, not L4CD 0xEBAA.
  stm32duino/STM32duino VL53L4ED@1.0.1

[env:native]
platform = native
test_framework = unity
build_flags =
  ${common.build_flags}
  -lm
lib_compat_mode = off
