; Determine camera board — AI-Thinker ESP32-CAM. Wire contract: protocol/PROTOCOL.md.
[platformio]
default_envs = esp32cam

[common]
build_flags =
  -I../common/include
  -Wall

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; Frame size with PSRAM (esp32-camera framesize_t). FRAMESIZE_QVGA is the fallback.
  -DDT_CAM_FRAMESIZE=FRAMESIZE_VGA
  -DDT_CAM_FPS=12
  ; Upper bound on camera UDP payload so the cue board's RANGE/ACK traffic is not starved.
  -DDT_CAM_MAX_KBPS=480
  -DDT_CAM_JPEG_QUALITY=14
test_ignore = *

[env:native]
platform = native
build_flags =
  ${common.build_flags}
test_build_src = no
